<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试用例管理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
            margin-right: 8px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        #testCasesList {
            display: grid;
            gap: 20px;
        }

        .test-case-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .test-case-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .test-case-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .test-case-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .test-case-id {
            color: #999;
            font-size: 0.9em;
        }

        .test-case-actions {
            display: flex;
            gap: 8px;
        }

        .test-case-field {
            margin-bottom: 12px;
        }

        .field-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 4px;
        }

        .field-value {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            background: #28a745;
            color: white;
        }

        .timestamp {
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 测试用例管理平台</h1>

        <!-- 创建/编辑测试用例表单 -->
        <div class="card">
            <h2 id="formTitle">创建测试用例</h2>
            <div id="messageContainer"></div>
            <form id="testCaseForm">
                <div class="form-group">
                    <label for="title">标题 <span style="color: red;">*</span></label>
                    <input type="text" id="title" name="title" required maxlength="200" 
                           placeholder="请输入测试用例标题（必填，最多200字符）">
                </div>

                <div class="form-group">
                    <label for="description">描述</label>
                    <textarea id="description" name="description" 
                              placeholder="请输入测试用例的详细描述"></textarea>
                </div>

                <div class="form-group">
                    <label for="steps">测试步骤</label>
                    <textarea id="steps" name="steps" 
                              placeholder="请输入测试步骤，每行一个步骤"></textarea>
                </div>

                <div class="form-group">
                    <label for="expected_result">预期结果</label>
                    <textarea id="expected_result" name="expected_result" 
                              placeholder="请输入预期的测试结果"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">创建测试用例</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">取消编辑</button>
            </form>
        </div>

        <!-- 测试用例列表 -->
        <div class="card">
            <h2>测试用例列表</h2>
            <div id="testCasesList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let editingId = null;
        const API_BASE_URL = '/api/test-cases';

        // 页面加载时获取测试用例列表
        document.addEventListener('DOMContentLoaded', () => {
            loadTestCases();
        });

        // 表单提交事件
        document.getElementById('testCaseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 获取表单数据
            const formData = {
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim() || null,
                steps: document.getElementById('steps').value.trim() || null,
                expected_result: document.getElementById('expected_result').value.trim() || null,
                status: 'active'
            };

            // 验证必填字段
            if (!formData.title) {
                showMessage('标题不能为空', 'error');
                return;
            }

            try {
                // 调用 POST /api/test-cases API
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    // 处理错误响应
                    const errorData = await response.json();
                    let errorMessage = '创建失败';
                    
                    if (response.status === 422) {
                        // 验证错误
                        if (errorData.detail && Array.isArray(errorData.detail)) {
                            errorMessage = errorData.detail.map(err => err.msg).join(', ');
                        } else {
                            errorMessage = '数据验证失败，请检查输入';
                        }
                    } else {
                        errorMessage = errorData.detail || `创建失败 (${response.status})`;
                    }
                    
                    showMessage(errorMessage, 'error');
                    return;
                }

                // 处理成功响应
                const newTestCase = await response.json();
                showMessage(`测试用例 "${newTestCase.title}" 创建成功！`, 'success');
                
                // 清空表单
                document.getElementById('testCaseForm').reset();
                
                // 刷新列表
                loadTestCases();
                
            } catch (error) {
                // 处理网络错误或其他异常
                console.error('创建测试用例时发生错误:', error);
                showMessage('网络错误，请检查连接后重试', 'error');
            }
        });

        // 取消编辑按钮（将在任务15中实现）
        document.getElementById('cancelBtn').addEventListener('click', () => {
            // 功能将在任务15中实现
        });

        // 加载测试用例列表（将在任务14中实现）
        function loadTestCases() {
            const listContainer = document.getElementById('testCasesList');
            listContainer.innerHTML = '<div class="loading">加载中...</div>';
            
            // 功能将在任务14中实现
            setTimeout(() => {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>暂无测试用例，请创建第一个测试用例</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">（列表加载功能将在任务14中实现）</p>
                    </div>
                `;
            }, 500);
        }

        // 显示消息提示
        function showMessage(message, type = 'success') {
            const container = document.getElementById('messageContainer');
            const messageClass = type === 'success' ? 'success-message' : 'error-message';
            container.innerHTML = `<div class="${messageClass}">${message}</div>`;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // 格式化日期时间
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
    </script>
</body>
</html>
